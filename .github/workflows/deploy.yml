name: Build and deploy

on:
  push:
    branches: [main]
  # Refresh "Next flying days" and the booking calendar snapshot from the Flying Schedule.
  schedule:
    - cron: '7 */3 * 4-10 *'      # every three hours, April to October
    - cron: '7 12 * 1-3,11,12 *'  # daily otherwise
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      # SITE_URL and BASE_PATH come from the Pages settings: the github.io address
      # and repository path before the cutover, www.pagsc.ca and no path after it.
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
