discovery_flight:
  price: 50
  group_price_each: 40
  group_minimum: 4
  duration_minutes: "5 to 30"
  launch: winch
  launch_height_feet_min: 1500   # winch launches reach about 1,500 to 2,000 ft
  launch_height_feet: 2000
  max_weight_lbs: 230
  membership_required: false
  experience_required: false
  when: Weekends and holidays, about 11 am to 5 pm, weather permitting
  weekdays: Some weekdays too, often on request
  season: Spring through fall, with occasional winter flying
  weather_cancellation: Rebooked at no charge
  bring:
    - Hat, sunscreen, sunglasses
    - Water, lunch or snacks
    - Layers; it is cooler at altitude
    - A way to pay (e-transfer or cash)
    - A phone or camera, if you like
  day:
    - Meet the crew and get a safety briefing.
    - "Fly: a winch launch to about 1,500 to 2,000 feet, with a club pilot beside you the whole time."
    - Stay, watch, learn, and fly again if time allows.

