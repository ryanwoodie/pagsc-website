fleet:   # published type data; see open question Q12
  - name: Schleicher K7 Rhönadler
    role: Two-seat trainer
    description: Where every first flight and lesson happens. Steel-tube fuselage with wood and fabric wings, designed by Rudolf Kaiser as a trainer.
    seats: 2
    wingspan_m: 16.0
    best_glide: "26:1"
    min_sink_ms: 0.70
    empty_weight_kg: 282
    introduced: 1960
  - name: Schleicher Ka 6E
    role: Single-seater
    description: One of the most loved and best-handling gliders ever made. A classic wooden sailplane, also a Rudolf Kaiser design, with an all-flying tailplane.
    seats: 1
    wingspan_m: 15.0
    best_glide: "32:1"
    min_sink_ms: 0.65
    empty_weight_kg: 190
    introduced: 1965
  - name: Bölkow Phoebus C
    role: Single-seater
    description: An early fibreglass sailplane with a 17-metre wing, a T-tail and a retractable wheel. The highest performer of the three.
    seats: 1
    wingspan_m: 17.0
    best_glide: "39:1"
    min_sink_ms: 0.63
    empty_weight_kg: 240
    introduced: 1967
