  last_start: "16:00"
  minutes_per_person: 30
  guest_spots_per_day: 6
  max_group: 4
  days_ahead: 28

fees:
  membership:
    regular: { price: 150, per: year, who: Anyone not covered by the two categories below }
    junior: { price: 75, per: year, who: "Under 21, or a full-time student under 25" }
    youth_air_cadet: { price: 15, per: year, who: Under 19 }
  membership_notes:
    - Every membership includes Soaring Association of Canada membership.
    - New members joining after August 1 pay half.
    - Ages are as of January 1 of the membership year.
  winch_launch: 5
  glider_rental_per_hour: 30
  glider_rental_per_minute: 0.50
  instruction: 0   # free; taught by club members who hold an instructor rating
  typical_lesson_flight: { minutes: 10, cost: 10, breakdown: "$5 launch plus $5 of glider time" }   # shown as an "instructional flight"
  payment: E-transfer to the club email
  guest_payment: E-transfer or cash

training:
  start_age: none
  solo_age: 14
  licence_age: 16
  flights_to_solo: around 40              # typical, from scratch
  flights_to_solo_experienced: 10 to 20   # with previous aviation experience or a pilot licence
  who_can_learn:
    - All flying before solo is dual, with a certified instructor as pilot-in-command.
    - You need to reach the controls comfortably (roughly 5 ft tall) and be ready to learn (typically 12 and up).
    - Maximum weight for an introductory flight is 230 lbs.
  steps:
    - title: Flight lessons
      text: Dual lessons in the air with an instructor, at your own pace. Book each one on the schedule.
    - title: "Medical: do this early"
      text: Most students use a Category 4 medical, a self-declaration with no doctor's visit. Do it and your student licence paperwork early. A Category 1 or 3 also counts.
    - title: Ground school and the GLIDE exam
      text: 15 hours, self-directed or with pilottraining.ca, then Transport Canada's GLIDE written exam (60% to pass).
    - title: First solo, from age 14
      text: Once your instructor is satisfied you are ready.
    - title: Licence, from age 16
      text: Solo practice, then a flight test. You need at least 6 hours of flight time, including 1 hour dual, 2 hours solo and 20 solo flights.
  come_regularly: Skills fade between visits. Flying as many weekends (and even weekdays) as you can over a stretch of the season gets you solo sooner and costs less in total.

youth:
  membership_price: 15
  bursary_sac: 500
  bursary_club_match: 500
  bursary_total: 1000
  bursary_covers: Launches and glider rental
  bursary_who: SAC members under 21, or full-time students under 25, as of January 1
  bursaries_per_club: 5   # SAC's maximum per club; availability is set by SAC each year
  cadets: Air Cadets who earn their Glider Pilot Licence here can also do a Soaring Pilot Conversion for their cadet wings.

power_pilots:
  summary: With a PPL(A) you skip ground school and the written exam, and need 3 flight hours, not 6.
  table:
    - { requirement: Medical, from_scratch: "Category 1, 3 or 4", with_ppl: Your existing Category 1 or 3 }
    - { requirement: Ground school, from_scratch: 15 hours, with_ppl: Waived }
    - { requirement: Written exam, from_scratch: "GLIDE, 60% to pass", with_ppl: Waived }
    - { requirement: Total flight time, from_scratch: 6 hours, with_ppl: 3 hours }
    - { requirement: Dual instruction, from_scratch: 1 hour, with_ppl: 1 hour }
    - { requirement: Solo flight time, from_scratch: 2 hours, with_ppl: 2 hours }
    - { requirement: Solo flights, from_scratch: "20", with_ppl: "20" }
    - { requirement: Skill assessment, from_scratch: Flight demo and recommendation, with_ppl: Flight demo and recommendation }
  credit_back:
    ppl_hours: 5
    cpl_hours: 50
    cpl_total_requirement_hours: 200

